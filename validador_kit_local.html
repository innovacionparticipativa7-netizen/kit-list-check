<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Validador de Kit List</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f4f5f7;color:#1b1f24}
  header{background:#111827;color:#fff;padding:14px 16px}
  header h1{margin:0;font-size:18px}
  main{max-width:640px;margin:0 auto;padding:12px}
  .card{background:#fff;border:1px solid #e3e6ea;border-radius:12px;padding:14px;margin-bottom:12px}
  h2{font-size:16px;margin:0 0 10px}
  .btn{display:block;width:100%;padding:14px;border-radius:10px;border:0;background:#1f4fd1;color:#fff;font-size:16px;font-weight:600;margin-top:8px;cursor:pointer}
  .btn.gray{background:#374151}
  .btn.light{background:#eef2ff;color:#1f4fd1}
  .btn.green{background:#0f8a4b}
  .hidden{display:none!important}
  #reader{width:100%;border-radius:10px;overflow:hidden;background:#000;margin-top:10px}
  .banner{border-radius:12px;padding:16px;text-align:center;font-weight:800;font-size:22px}
  .banner small{display:block;font-weight:500;font-size:14px;margin-top:4px}
  .ok{background:#e6f6ee;color:#0f8a4b}.bad{background:#fdecec;color:#c62828}.warn{background:#fff4e0;color:#a15c00}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:#6b7280;font-size:12px;padding:6px 4px;border-bottom:1px solid #e3e6ea}
  td{padding:7px 4px;border-bottom:1px solid #e3e6ea;font-family:ui-monospace,Menlo,monospace}
  .pill{border-radius:999px;padding:2px 8px;font-size:12px;font-weight:700;font-family:system-ui}
  .scan{border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:14px}
  .meta{font-size:13px;color:#6b7280;margin-bottom:8px}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);padding:12px 18px;border-radius:10px;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:9}
  input{width:100%;font-size:15px;padding:10px;border:1px solid #e3e6ea;border-radius:8px;font-family:ui-monospace,Menlo,monospace}
</style>
</head>
<body>
<header><h1>Validador de Kit List · QR + Data Matrix</h1></header>
<main>
  <div class="card">
    <button class="btn" id="startBtn">📷 Abrir cámara</button>
    <button class="btn gray hidden" id="stopBtn">⏹ Cerrar cámara</button>
    <div id="reader" class="hidden"></div>
    <p class="meta" style="margin-top:10px">1) Apunta al <b>QR del Kit List</b>. 2) Apunta al <b>Data Matrix</b> de cada pieza. Se detecta y guarda solo.</p>
    <input id="manual" placeholder="O escribe el código y presiona Enter">
  </div>

  <div class="card"><div id="banner" class="banner warn">Escanea el QR del Kit List</div></div>

  <div class="card hidden" id="kitCard">
    <h2>Kit List</h2>
    <div class="meta" id="kitMeta"></div>
    <table><thead><tr><th>Material</th><th>Lote</th><th>Rev</th><th>Cant</th><th>Estado</th></tr></thead><tbody id="kitBody"></tbody></table>
  </div>

  <div class="card hidden" id="scanCard"><h2>Piezas escaneadas</h2><div id="scanList"></div></div>

  <div class="card">
    <button class="btn green" id="saveBtn">💾 Cerrar kit y guardar en historial</button>
    <button class="btn light" id="csvBtn">⬇️ Descargar historial (Excel/CSV)</button>
    <p class="meta" id="histInfo" style="margin-top:10px"></p>
    <button class="btn gray" id="clearHist" style="background:#9ca3af">Borrar historial</button>
  </div>
</main>
<div id="toast" class="toast hidden"></div>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const norm = s => String(s ?? '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- Guardado en el teléfono ----------
function load(key, def) { try { return JSON.parse(localStorage.getItem(key)) ?? def; } catch (e) { return def; } }
function store(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }
let state = load('kit_actual', { kit: null, scans: [] });
let hist = load('kit_historial', []);

// ---------- Leer códigos ----------
// QR Kit List:  MO:8848600|OP:9800|CP0598637;2603030700;NC;1|C515611-5;2609096448;B;2
// Data Matrix pieza:  C515611-5;2609096448;B   (o PN:...;LOT:...;REV:...)
function isKit(t) { return /\bMO\s*:/i.test(t) || t.split(/\r?\n|\|/).filter(r => r.includes(';')).length >= 2; }
function parseKit(t) {
  const k = { mo: '', op: '', lineas: [] };
  t.split(/\r?\n|\|/).map(s => s.trim()).filter(Boolean).forEach(x => {
    if (x.includes(';')) { const [item, lote, rev, cant] = x.split(';').map(s => s.trim()); if (item) k.lineas.push({ item, lote: lote || '', rev: rev || '', cant: cant || '' }); }
    else { const m = x.match(/^(MO|OP)\s*:\s*(.+)$/i); if (m) k[m[1].toLowerCase()] = m[2].trim(); }
  });
  return k;
}
function parsePiece(t) {
  if (/(PNR|PN|P\/N)\s*[: ]/i.test(t)) {
    const g = re => (t.match(re) || [])[1] || '';
    return { parte: g(/(?:PNR|PN|P\/N)\s*[: ]\s*([A-Z0-9\-]+)/i), lote: g(/(?:LOT|LTN|BATCH)\s*[: ]\s*([A-Z0-9\-]+)/i), rev: g(/REV\s*[: ]\s*([A-Z0-9]+)/i) };
  }
  const [parte, lote, rev] = t.split(/[;|]/).map(s => (s || '').trim());
  return { parte: parte || '', lote: lote || '', rev: rev || '' };
}

// ---------- Comparar ----------
function judge(p) {
  if (!state.kit) return { cls: 'warn', txt: 'Falta escanear el Kit List' };
  const ls = state.kit.lineas.map((l, i) => ({ l, i })).filter(x => norm(x.l.item) === norm(p.parte));
  if (!ls.length) return { cls: 'bad', bad: 1, txt: `❌ ${p.parte} no está en el Kit List` };
  const hit = ls.find(x => norm(x.l.lote) === norm(p.lote));
  if (hit) return { cls: 'ok', ok: 1, line: hit.i, txt: `✅ ${p.parte} lote ${p.lote} coincide` };
  return { cls: 'bad', bad: 1, line: ls[0].i, txt: `❌ ${p.parte}: lote diferente. Lista ${ls.map(x => x.l.lote).join(', ')} · Pieza ${p.lote || '—'}` };
}
function summary() {
  if (!state.kit) return { cls: 'warn', title: 'Escanea el QR del Kit List', sub: '' };
  const st = {}; let bad = 0;
  state.scans.forEach(s => { const v = judge(s); if (v.bad) bad++; if (v.line != null && st[v.line] !== 'bad') st[v.line] = v.bad ? 'bad' : 'ok'; });
  const missing = state.kit.lineas.filter((_, i) => !st[i]).length;
  if (bad) return { st, cls: 'bad', title: '❌ NO COINCIDE', sub: `${bad} pieza(s) con diferencia`, res: 'NO COINCIDE' };
  if (missing) return { st, cls: 'warn', title: '⚠️ INCOMPLETO', sub: `Faltan ${missing} de ${state.kit.lineas.length} renglones`, res: 'INCOMPLETO' };
  return { st, cls: 'ok', title: '✅ TODO COINCIDE', sub: `${state.kit.lineas.length} renglones verificados`, res: 'COINCIDE' };
}

// ---------- Pantalla ----------
function render() {
  store('kit_actual', state);
  const s = summary();
  $('banner').className = 'banner ' + s.cls;
  $('banner').innerHTML = s.title + (s.sub ? `<small>${s.sub}</small>` : '');
  $('kitCard').classList.toggle('hidden', !state.kit);
  if (state.kit) {
    $('kitMeta').textContent = `MO ${state.kit.mo || '—'} · Op ${state.kit.op || '—'}`;
    $('kitBody').innerHTML = state.kit.lineas.map((l, i) => {
      const x = s.st[i];
      const pill = x === 'ok' ? '<span class="pill ok">✅ OK</span>' : x === 'bad' ? '<span class="pill bad">❌ No</span>' : '<span class="pill warn">Falta</span>';
      return `<tr><td>${esc(l.item)}</td><td>${esc(l.lote)}</td><td>${esc(l.rev)}</td><td>${esc(l.cant)}</td><td>${pill}</td></tr>`;
    }).join('');
  }
  $('scanCard').classList.toggle('hidden', !state.scans.length);
  $('scanList').innerHTML = state.scans.slice().reverse().map(x => { const v = judge(x); return `<div class="scan ${v.cls}">${esc(v.txt)}<br><small>${esc(x.hora)} · ${esc(x.raw)}</small></div>`; }).join('');
  $('histInfo').textContent = `Historial guardado: ${hist.length} kit(s).`;
}

let actx, tt;
function feedback(good, msg) {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = good ? 1100 : 300; g.gain.value = .15; o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + (good ? .12 : .35)); } catch (e) {}
  try { navigator.vibrate && navigator.vibrate(good ? 60 : [120, 60, 120]); } catch (e) {}
  const t = $('toast'); t.className = 'toast ' + (good ? 'ok' : 'bad'); t.textContent = msg;
  clearTimeout(tt); tt = setTimeout(() => t.classList.add('hidden'), 2000);
}

// ---------- Al detectar un código ----------
let lastT = '', lastAt = 0;
function onCode(text) {
  text = String(text || '').trim(); if (!text) return;
  if (text === lastT && Date.now() - lastAt < 3000) return;
  lastT = text; lastAt = Date.now();
  const hora = new Date().toLocaleString();
  if (isKit(text)) {
    const k = parseKit(text);
    if (!k.lineas.length) return feedback(false, 'QR sin renglones válidos');
    if (state.kit && state.kit.mo !== k.mo && state.scans.length) saveKit(true);
    state = { kit: k, scans: [], inicio: hora };
    render(); return feedback(true, `Kit List cargado: ${k.lineas.length} renglones`);
  }
  const p = parsePiece(text);
  if (!p.parte) return feedback(false, 'Código no reconocido');
  if (state.scans.some(x => norm(x.raw) === norm(text))) return feedback(true, 'Esa pieza ya está registrada');
  state.scans.push({ raw: text, hora, ...p });
  render();
  const v = judge(p); feedback(!!v.ok, v.ok ? '✅ Coincide' : '❌ No coincide');
}

// ---------- Cámara (detección en vivo) ----------
let scanner = null, running = false;
async function startCam() {
  if (!window.Html5Qrcode) return feedback(false, 'No cargó el lector. Revisa internet.');
  scanner = scanner || new Html5Qrcode('reader', { formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE, Html5QrcodeSupportedFormats.DATA_MATRIX], experimentalFeatures: { useBarCodeDetectorIfSupported: true }, verbose: false });
  $('reader').classList.remove('hidden');
  try {
    await scanner.start({ facingMode: 'environment' }, { fps: 15, qrbox: (w, h) => { const m = Math.floor(Math.min(w, h) * .75); return { width: m, height: m }; } }, onCode, () => {});
    running = true; $('startBtn').classList.add('hidden'); $('stopBtn').classList.remove('hidden');
  } catch (e) {
    $('reader').classList.add('hidden');
    feedback(false, 'No se abrió la cámara: da permiso y abre la página con https');
  }
}
async function stopCam() {
  if (running) { try { await scanner.stop(); } catch (e) {} }
  running = false; $('reader').classList.add('hidden'); $('startBtn').classList.remove('hidden'); $('stopBtn').classList.add('hidden');
}
$('startBtn').onclick = startCam;
$('stopBtn').onclick = stopCam;
$('manual').onkeydown = e => { if (e.key === 'Enter') { onCode(e.target.value); e.target.value = ''; } };

// ---------- Historial ----------
function saveKit(silent) {
  if (!state.kit) return silent || feedback(false, 'No hay kit cargado');
  const s = summary();
  hist.push({ fecha: new Date().toLocaleString(), mo: state.kit.mo, op: state.kit.op, resultado: s.res, kit: state.kit, scans: state.scans.map(x => ({ ...x, estado: judge(x).ok ? 'COINCIDE' : 'NO COINCIDE' })) });
  store('kit_historial', hist);
  state = { kit: null, scans: [] };
  render();
  if (!silent) feedback(true, 'Kit guardado en historial');
}
$('saveBtn').onclick = () => saveKit(false);
$('csvBtn').onclick = () => {
  if (!hist.length) return feedback(false, 'Historial vacío');
  const rows = [['Fecha', 'MO', 'Operacion', 'Resultado kit', 'Hora escaneo', 'Parte', 'Lote', 'Rev', 'Estado pieza']];
  hist.forEach(h => (h.scans.length ? h.scans : [{}]).forEach(x => rows.push([h.fecha, h.mo, h.op, h.resultado, x.hora || '', x.parte || '', x.lote || '', x.rev || '', x.estado || ''])));
  const csv = '\ufeff' + rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `historial_kits_${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
};
$('clearHist').onclick = () => { if (confirm('¿Borrar todo el historial?')) { hist = []; store('kit_historial', hist); render(); } };

render();
</script>
</body>
</html>
